name: Build Windows Executable

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install pyinstaller

      - name: Run dev unit tests
        env:
          PYTHONPATH: app
        run: |
          python -m unittest discover -s dev-tests

      - name: Build EXE with PyInstaller
        run: |
          cd app
          pyinstaller build.spec

      - name: Copy asset directories to output build
        shell: pwsh
        run: |
          if (Test-Path "app/fonts") {
              Copy-Item -Path "app/fonts" -Destination "app/dist/BarnameMotaleati/fonts" -Recurse -Force
          }
          if (Test-Path "app/aks") {
              Copy-Item -Path "app/aks" -Destination "app/dist/BarnameMotaleati/aks" -Recurse -Force
          }
          if (Test-Path "app/templates") {
              Copy-Item -Path "app/templates" -Destination "app/dist/BarnameMotaleati/templates" -Recurse -Force
          }

      - name: Create ZIP Archive
        shell: pwsh
        run: |
          Compress-Archive -Path "app/dist/BarnameMotaleati/*" -DestinationPath "BarnameMotaleati-Windows.zip" -Force

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BarnameMotaleati-Windows
          path: BarnameMotaleati-Windows.zip
          if-no-files-found: error
